<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Tiket Konsert Shila Amzah</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Sistem Pengurusan Tiket Konsert</h1>
                <p class="status-bar" id="syncStatus">Memuatkan...</p>
            </div>
            <div class="toolbar-group">
                <button class="btn btn-secondary" type="button" onclick="exportCurrentTabCSV()">Export Tab Ini (CSV)</button>
                <button class="btn btn-success" type="button" onclick="exportAllToExcel()">Export Semua Tab (Excel)</button>
                <label class="btn btn-secondary" style="margin:0;">
                    Import Data
                    <input type="file" id="importFile" accept=".json,.xlsx,.xls" style="display:none;" onchange="importDataFromFile(event)">
                </label>
            </div>
        </header>

        <div class="dashboard" id="dashboardSummary"></div>

        <div class="tabs-nav" id="tabsNav"></div>

        <div class="content-card">
            <div class="toolbar">
                <input type="text" id="searchInput" class="search-box" placeholder="Cari..." oninput="filterTable()">
                <button class="btn" type="button" onclick="openEntryModal()">+ Tambah Orang Baru</button>
            </div>

            <div class="table-responsive">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="entryModal">
        <div class="modal-body">
            <h3 id="modalTitle">Tambah Rekod Baru</h3>
            <form id="entryForm" onsubmit="saveEntry(event)">
                <div id="formFields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEntryModal()">Batal</button>
                    <button type="submit" class="btn">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="tabModal">
        <div class="modal-body">
            <h3>Tambah Tab Baru</h3>
            <form onsubmit="saveNewTab(event)">
                <div class="form-group">
                    <label>Nama Tab Baru</label>
                    <input type="text" id="newTabName" required placeholder="Contoh: Kumpulan C">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeTabModal()">Batal</button>
                    <button type="submit" class="btn">Cipta Tab</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" defer></script>
    <script src="js/firebase-config.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
